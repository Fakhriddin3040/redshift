# Allowed actions per pattern and level. Written by people, not by a model.
# The backend fills alert text {what, why, action} from this file and from the
# incident's own numbers (T6a). 1-3 short steps per entry. Vigil is a prototype
# and not a medical device: every list ends with a person, not with a diagnosis.

hypoxia:
  watch:
    - Check the sensor fit and repeat the reading.
  alert:
    - Check the sensor fit and repeat the reading with the kit oximeter.
    - Sit or anchor yourself and breathe slowly for two minutes.
  critical:
    - Check the sensor fit and repeat the reading with the kit oximeter.
    - If it stays at 91 % or below, notify the crew medical officer.

tachycardia_rest:
  watch:
    - Sit or anchor yourself and breathe slowly for two minutes.
  alert:
    - Stop activity, sit or anchor yourself and breathe slowly for two minutes.
    - Repeat the reading.
  critical:
    - Stop activity, sit or anchor yourself and breathe slowly for two minutes.
    - Repeat the reading. If it does not settle, notify the crew medical officer.

bradycardia:
  watch:
    - Check the sensor fit and repeat the reading.
  alert:
    - Check the sensor fit and repeat the reading.
    - Note any dizziness or weakness in the daily check-in.
  critical:
    - Check the sensor fit and repeat the reading.
    - If it stays at 40 bpm or below, notify the crew medical officer.

fever_like:
  watch:
    - Check that the wristband is not under a sleeve or against a warm surface.
  alert:
    - Take your temperature with the kit thermometer.
    - Note any symptoms in the daily check-in.
  critical:
    - Take your temperature with the kit thermometer.
    - Notify the crew medical officer.

hypercapnia:
  watch:
    - Check the airflow where you are working and sleeping.
  alert:
    - Move to a module with fresh airflow.
    - Report the reading to the commander.
  critical:
    - Move to a module with fresh airflow.
    - Report the reading to the ground and the commander.

depressurization:
  alert:
    - Follow the emergency procedure for a pressure leak.
    - Notify the commander and the ground.
  critical:
    - Follow the emergency procedure for a pressure leak.
    - Notify the commander and the ground.

sensor_artifact:
  watch:
    - Check the sensor fit and keep the arm still for one minute.
  alert:
    - Check the sensor fit and keep the arm still for one minute.
    - Repeat the reading.
  critical:
    - Check the sensor fit and repeat the reading with the kit device.
    - If it does not change, notify the crew medical officer.

# Used when no pattern is named.
default:
  watch:
    - Check the sensor fit and repeat the reading.
  alert:
    - Check the sensor fit and repeat the reading.
  critical:
    - Check the sensor fit and repeat the reading.
    - Notify the crew medical officer.
