[env:esp32-s3-mini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Memory configuration for ESP32-S3FH4R2 (4MB QIO Flash, 2MB QSPI PSRAM)
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = huge_app.csv

; Enable PSRAM and Native USB CDC Serial
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit GC9A01A
    sparkfun/SparkFun BMI270 Arduino Library
    Adafruit BMP3XX Library
    links2004/WebSockets

; Static analysis — только свой код
check_tool = cppcheck
check_skip_packages = yes
check_src_filters = +<src/> +<include/>
check_flags =
    cppcheck: --enable=warning,style,performance --inline-suppr -j 8 --max-configs=1

monitor_filters = direct
