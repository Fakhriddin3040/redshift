[project]
name = "vigil"
version = "0.1.0"
description = "Vigil backend: crew health monitoring server (NASA Space Apps 2026)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "litestar>=2.24.0,<3.0.0",
    "uvicorn[standard]>=0.42.0,<0.43.0",
    "asyncpg>=0.31.0,<0.32.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "httpx>=0.28.1,<0.29.0",
    "numpy>=2.3.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "ruff>=0.15.22",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vigil*"]

[tool.setuptools.package-data]
"vigil.backend" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]
ignore = ["E501", "B008"]
