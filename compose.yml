services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
      POSTGRES_DB: vigil
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil -d vigil"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      net:

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      VIGIL_DATABASE_URL: postgresql://vigil:vigil@postgres:5432/vigil
      # Fixed: inside the container localhost is the container itself.
      VIGIL_VDEV_URL: http://vdev:8100
      VIGIL_OLLAMA_URL: ${VIGIL_OLLAMA_URL:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      # Healthy once the schema is created, the state is restored and HTTP answers.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    networks:
      net:

  vdev:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "vigil.vdev.app:app", "--host", "0.0.0.0", "--port", "8100"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VDEV_INGEST_URL: ws://backend:8000/api/v1/ingest
      VDEV_BACKEND_URL: http://backend:8000/api/v1
    networks:
      net:

  client:
    build:
      context: ./client
      args:
        # Baked into the browser bundle, so it must be reachable from the browser (host), not the compose network.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${BACKEND_PORT:-8000}/api/v1}
        NEXT_PUBLIC_CREW_ID: ${NEXT_PUBLIC_CREW_ID:-1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    networks:
      net:

volumes:
  pgdata:

networks:
  net:
    name: net
    external: false
