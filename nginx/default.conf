# Plain HTTP on port 80. TLS ends at Traefik, which forwards here.
#   /api/*  -> backend (REST + WebSockets /api/v1/live, /api/v1/ingest)
#   the rest -> client (Next.js)

upstream backend {
    server backend:8000;
}

upstream client {
    server client:3000;
}

# WebSocket upgrade only when the browser asks for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Traefik already tells us whether the visitor used https; keep its answer.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /api/ {
        proxy_pass http://backend;
        # /live stays open for as long as the page is open.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://client;
    }
}
